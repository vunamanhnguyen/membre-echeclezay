<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Échec Lezay 26-27</title><style>
:root{--bg:#f5f5f2;--surface:#fff;--surface2:#ededeb;--text:#11110f;--muted:#6d6d68;--border:#deded9;--accent:#11110f;--accentText:#fff;--danger:#b42318;--shadow:0 18px 50px rgba(0,0,0,.08);--radius:22px}
html.dark{--bg:#0b0b0a;--surface:#151514;--surface2:#20201e;--text:#f5f5f2;--muted:#a3a39d;--border:#30302d;--accent:#f5f5f2;--accentText:#0b0b0a;--danger:#ff7b72;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.container{width:min(1120px,calc(100% - 32px));margin:auto}.topbar{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:var(--bg)}.topin{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:38px;height:38px;border:1px solid var(--border);border-radius:12px;display:grid;place-items:center}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 15px;border-radius:12px;font-weight:700}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.icon{width:42px;height:42px;padding:0}main{padding:44px 0 70px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.formwrap{min-height:calc(100vh - 72px);display:grid;place-items:center}.formcard{width:min(470px,100%);padding:34px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}h1{font-size:clamp(40px,6vw,64px);line-height:.98;letter-spacing:-.055em;margin:14px 0}h2{letter-spacing:-.035em}p{line-height:1.6;color:var(--muted)}.field{margin:16px 0}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input,select{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:13px 14px;outline:none}.formcard .btn.primary{width:100%;margin-top:8px}.message{margin-top:14px;font-size:14px}.error{color:var(--danger)}.small{font-size:13px;color:var(--muted)}.center{text-align:center}.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}.dashboard{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.dashboard h1{font-size:48px;margin:8px 0}.badge{display:inline-flex;padding:6px 9px;border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:800}.profile{padding:28px}.row{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.tile{padding:24px}.tile h3{margin-bottom:8px}.notice{padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);margin-top:16px}.adminstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.metric{padding:22px}.metric strong{display:block;font-size:34px}.tablecard{padding:24px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:13px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}@media(max-width:800px){.grid{grid-template-columns:1fr}.adminstats{grid-template-columns:repeat(2,1fr)}.dashboard{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.adminstats{grid-template-columns:1fr}.topbar{height:64px}}
</style><script>
(()=>{const t=localStorage.getItem("theme")||"dark";if(t==="dark")document.documentElement.classList.add("dark")})();
</script></head><body>
<header class="topbar"><div class="container topin"><a class="brand" href="index.html"><span class="logo">♞</span>Échec Lezay 26-27</a><div class="actions"><button class="btn icon" id="theme">☀</button><a class="btn" href="register.html">Inscription</a></div></div></header>
<main class="formwrap"><div class="container"><section class="card formcard"><div class="eyebrow">Espace membres</div><h1>Connexion</h1><p>Accédez à votre espace personnel du club.</p><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Mot de passe</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary" type="submit">Se connecter</button><div id="msg" class="message"></div></form><p class="small center">Pas encore membre ? <a href="register.html"><strong>Créer un compte</strong></a></p></section></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";\nimport {getFirestore} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBgWYlvv48U4IjICwqEyIwBo0p-EWqtI3I",
  authDomain: "echeclezay-membre.firebaseapp.com",
  projectId: "echeclezay-membre",
  storageBucket: "echeclezay-membre.firebasestorage.app",
  messagingSenderId: "1074805297788",
  appId: "1:1074805297788:web:94bdc76b959618e97beff9"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const root=document.documentElement,t=document.getElementById("theme");function theme(v,s=false){root.classList.toggle("dark",v==="dark");t.textContent=v==="dark"?"☀":"☾";if(s)localStorage.setItem("theme",v)}theme(localStorage.getItem("theme")||"dark");t.onclick=()=>theme(root.classList.contains("dark")?"light":"dark",true);
onAuthStateChanged(auth,u=>{if(u)location.href="index.html"});
form.onsubmit=async e=>{e.preventDefault();msg.className="message";msg.textContent="Connexion…";try{await signInWithEmailAndPassword(auth,email.value,password.value);location.href="index.html"}catch(x){msg.className="message error";msg.textContent="E-mail ou mot de passe incorrect."}};
</script></body></html>
